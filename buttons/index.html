<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buttons - Naomi Turk</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:400,300,300italic,400italic,600,600italic,700,700italic,800,800italic"
          rel="stylesheet">

    <link href="https://fonts.googleapis.com/css?family=Montserrat"
          rel="stylesheet">

    <link href="https://fonts.googleapis.com/css?family=Ubuntu:700"
          rel="stylesheet">

    <!-- Adobe Fonts -->
    <link rel="stylesheet" href="https://use.typekit.net/ymd6dhz.css">


    <!-- Font Awesome icons -->
    <link href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css"
          rel="stylesheet">

    <link href="css/styles.css" rel="stylesheet">
</head>

<body>
    <main>
        <h1>Button Styling - Naomi Turk</h1>

        <div class="button_container">
            <a href="https://www.spotify.com"
               target="_blank"
               id="btn_spotify">Spotify</a>
        </div>

        <div class="button_container">
            <a href="https://www.amazon.com"
               target="_blank"
               id="btn_amazon">
                <i class="fa fa-amazon"></i>
            </a>
        </div>

        <div class="button_container">
            <a href="https://www.twitter.com"
               target="_blank"
               id="btn_twitter">twitter</a>
        </div>

        <div class="button_container">
            <a href="https://www.indiegogo.com"
               target="_blank"
               id="btn_indiegogo">
                <span>indiegogo</span>
            </a>
        </div>

        <div class="button_container">
        <a href="https://www.nike.com"
        target="_blank"
        id="btn_nike">
        <span class="nike-name">NIKE</span>
        <span class="nike-slogan">JUST DO IT.</span>
        </a>
        </div>

        <div class="button_container">
        <a href="https://www.lyft.com"
        target="_blank"
        id="btn_lyft">
        <span class="lyft">lyft</span>
        </a>
        </div>

        <div class="button_container">
        <a href="https://www.harley-davidson.com/us/en/index.html"
       target="_blank"
       id="btn_harley">
        <img src="images/harleydavidson.png" alt="Harley-Davidson logo">
        </a>
        </div>


      <div class="button_container">
        <a href="https://www.ibm.com/us-en"
       target="_blank"
       id="btn_ibm">
        <img class="ibm-white" src="images/ibmlogowhite.svg" alt="IBM logo">
        <img class="ibm-black" src="images/ibmlogoblack.svg" alt="">
        </a>
        </div>

        <div class="button_container">
        <a href="http://www.teslamotors.com/"
       target="_blank"
       id="btn_tesla">
        <img class="teslared" src="images/teslared.png" alt="Tesla logo">
        <img class="teslawhite" src="images/teslawhite.png" alt="">
        </a>
        </div>

    </main>
</body>
</html>
